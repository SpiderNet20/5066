    <script>
      (function () {
        var OrigWebSocket = window.WebSocket;
        if (OrigWebSocket) {
          var ProxyWebSocket = function (url, protocols) {
            var isViteWs =
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (Array.isArray(protocols) &&
                (protocols.indexOf('vite-hmr') !== -1 ||
                  protocols.indexOf('vite-ping') !== -1));
            if (isViteWs) {
              var fakeSocket = {
                url: String(url || ''),
                protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                readyState: 1,
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                onopen: null,
                onerror: null,
                onclose: null,
                onmessage: null,
                send: function () {},
                close: function () {
                  fakeSocket.readyState = 3;
                },
                addEventListener: function (type, listener) {
                  if (type === 'open' && typeof listener === 'function') {
                    setTimeout(function () {
                      try {
                        listener(new Event('open'));
                      } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function () {},
                dispatchEvent: function () {
                  return true;
                }
              };
              return fakeSocket;
            }
            return arguments.length > 1
              ? new OrigWebSocket(url, protocols)
              : new OrigWebSocket(url);
          };
          ProxyWebSocket.prototype = OrigWebSocket.prototype;
          ProxyWebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          ProxyWebSocket.OPEN = OrigWebSocket.OPEN;
          ProxyWebSocket.CLOSING = OrigWebSocket.CLOSING;
          ProxyWebSocket.CLOSED = OrigWebSocket.CLOSED;
          window.WebSocket = ProxyWebSocket;
        }
      })();
    </script>
